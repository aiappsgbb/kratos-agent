# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=0.1.25-preview'
name: kratos-agent
metadata:
    template: kratos-agent@0.1.0
services:
    agent-service:
        project: ./src/backend
        host: containerapp
        language: python
        docker:
            path: ./Dockerfile
            context: ../..
            # Build in ACR rather than locally. The image installs Python
            # packages, so a local build needs files.pythonhosted.org — which
            # is blocked on some corporate networks. Building remotely also
            # avoids needing a working Docker daemon to deploy.
            remoteBuild: true
    kratos-agent:
        project: ./src/hosted-agent
        host: azure.ai.agent
        language: docker
        docker:
            path: ./Dockerfile
            context: ../..
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: "1"
                    memory: 2Gi
            env:
                APM_USE_CASES_ROOT: /app/use-cases
                BLOB_SKILLS_CONTAINER: skills
                BLOB_STORAGE_ENDPOINT: ${AZURE_BLOB_STORAGE_ENDPOINT}
                COSMOS_DB_DATABASE: kratos-agent
                COSMOS_DB_ENDPOINT: ${AZURE_COSMOS_DB_ENDPOINT}
                KEY_VAULT_URI: ${AZURE_KEY_VAULT_URI}
                MODEL_DEPLOYMENT_NAME: ${FOUNDRY_MODEL_DEPLOYMENT}
                OBO_MCP_SERVER_MCP_URL: ${OBO_MCP_SERVER_MCP_URL}
                OBO_MCP_SERVER_NAME: graph-obo
    obo-mcp-server:
        project: ./src/obo-mcp-server
        host: containerapp
        language: python
        # infra/main.bicep only creates this container app when deployObo is
        # true, and main.parameters.json feeds that from the same DEPLOY_OBO
        # value with the same default. Without this condition azd tries to
        # deploy a service that was deliberately never provisioned, so
        # `azd up` always failed on environments with OBO turned off.
        condition: ${DEPLOY_OBO=true}
        docker:
            path: ./Dockerfile
            remoteBuild: true
    web:
        project: ./src/frontend
        host: staticwebapp
        language: js
        dist: out
        hooks:
            predeploy:
              posix:
                shell: sh
                run: |
                    # config.json tells the static frontend where the backend API is.
                    # When hosted behind Front Door under a sub-path (NEXT_PUBLIC_BASE_PATH,
                    # e.g. /kratos), the embedded UI calls the backend SAME-ORIGIN at
                    # <basePath>/api/* — Front Door routes /kratos/api/* to the Container
                    # App (stripping the /kratos prefix). This avoids CORS entirely.
                    # In standalone (root) deployments there is no sub-path, so we point
                    # config.json at the backend's own URL (AGENT_SERVICE_URL).
                    BP="$(printf '%s' "${NEXT_PUBLIC_BASE_PATH:-}" | sed 's#/*$##')"
                    if [ -n "$BP" ]; then
                      echo "{\"apiUrl\":\"${BP}\"}" > out/config.json
                      echo "Injected same-origin config.json with apiUrl=${BP} (behind Front Door)"
                    elif [ -n "${AGENT_SERVICE_URL}" ]; then
                      echo "{\"apiUrl\":\"${AGENT_SERVICE_URL}\"}" > out/config.json
                      echo "Injected config.json with apiUrl=${AGENT_SERVICE_URL}"
                    fi
                    # Merge the OBO sign-in config (Entra app + MCP scope) into
                    # config.json so MSAL.js can sign the user in and acquire a
                    # token for the OBO MCP server. Skipped if outputs are unset.
                    if [ -n "${OBO_CLIENT_APP_CLIENT_ID}" ] && [ -n "${OBO_TENANT_ID}" ] && [ -n "${OBO_SERVER_APP_IDENTIFIER_URI}" ]; then
                      [ -f out/config.json ] || echo "{}" > out/config.json
                      SCOPE="${OBO_SERVER_APP_IDENTIFIER_URI}/${OBO_SERVER_APP_SCOPE_VALUE:-access_as_user}"
                      AUTH_JSON="{\"clientId\":\"${OBO_CLIENT_APP_CLIENT_ID}\",\"tenantId\":\"${OBO_TENANT_ID}\",\"mcpScope\":\"${SCOPE}\",\"mcpServerName\":\"${OBO_MCP_SERVER_NAME:-graph-obo}\"}"
                      node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('out/config.json','utf8'));c.auth=JSON.parse(process.argv[1]);fs.writeFileSync('out/config.json',JSON.stringify(c));" "$AUTH_JSON"
                      echo "Merged OBO auth config into config.json (scope=${SCOPE})"
                    fi
                    # Emit a basePath-aware staticwebapp.config.json into out/ so the
                    # SWA EasyAuth 401 redirect + /api/* gating stay inside the mount
                    # path (e.g. /kratos) when hosted behind Front Door. Empty base
                    # path → straight copy (standalone root deployment).
                    if [ -f staticwebapp.config.json ]; then
                      if [ -n "$BP" ]; then
                        sed "s#/.auth/login/aad#${BP}/.auth/login/aad#g; s#\"/api/\*\"#\"${BP}/api/*\"#g" \
                          staticwebapp.config.json > out/staticwebapp.config.json
                        echo "Wrote basePath-aware staticwebapp.config.json (basePath=${BP})"
                      else
                        cp staticwebapp.config.json out/staticwebapp.config.json
                      fi
                    fi
              windows:
                shell: pwsh
                run: |
                    # PowerShell mirror of the posix branch above — see there for why
                    # config.json is written at deploy time rather than baked into the
                    # static export. Uses native JSON cmdlets, so unlike the sh version
                    # it does not shell out to node.
                    $ErrorActionPreference = 'Stop'
                    $BP = ($env:NEXT_PUBLIC_BASE_PATH ?? '') -replace '/+$', ''
                    if ($BP) {
                      @{ apiUrl = $BP } | ConvertTo-Json -Compress | Set-Content out/config.json -Encoding utf8
                      Write-Host "Injected same-origin config.json with apiUrl=$BP (behind Front Door)"
                    } elseif ($env:AGENT_SERVICE_URL) {
                      @{ apiUrl = $env:AGENT_SERVICE_URL } | ConvertTo-Json -Compress | Set-Content out/config.json -Encoding utf8
                      Write-Host "Injected config.json with apiUrl=$($env:AGENT_SERVICE_URL)"
                    }
                    if ($env:OBO_CLIENT_APP_CLIENT_ID -and $env:OBO_TENANT_ID -and $env:OBO_SERVER_APP_IDENTIFIER_URI) {
                      if (-not (Test-Path out/config.json)) { '{}' | Set-Content out/config.json -Encoding utf8 }
                      $ScopeValue = $env:OBO_SERVER_APP_SCOPE_VALUE ?? 'access_as_user'
                      $Scope = "$($env:OBO_SERVER_APP_IDENTIFIER_URI)/$ScopeValue"
                      $Cfg = Get-Content out/config.json -Raw | ConvertFrom-Json
                      $Cfg | Add-Member -NotePropertyName auth -NotePropertyValue ([pscustomobject]@{
                        clientId      = $env:OBO_CLIENT_APP_CLIENT_ID
                        tenantId      = $env:OBO_TENANT_ID
                        mcpScope      = $Scope
                        mcpServerName = $env:OBO_MCP_SERVER_NAME ?? 'graph-obo'
                      }) -Force
                      $Cfg | ConvertTo-Json -Compress -Depth 5 | Set-Content out/config.json -Encoding utf8
                      Write-Host "Merged OBO auth config into config.json (scope=$Scope)"
                    }
                    if (Test-Path staticwebapp.config.json) {
                      if ($BP) {
                        # .Replace() is literal — the "/api/*" pattern would otherwise
                        # need regex escaping.
                        # -NoNewline: -Raw already carries the file's own trailing
                        # newline, and Set-Content would otherwise append a second
                        # one, leaving the file one byte off from the sed output.
                        (Get-Content staticwebapp.config.json -Raw).
                          Replace('/.auth/login/aad', "$BP/.auth/login/aad").
                          Replace('"/api/*"', """$BP/api/*""") |
                          Set-Content out/staticwebapp.config.json -Encoding utf8 -NoNewline
                        Write-Host "Wrote basePath-aware staticwebapp.config.json (basePath=$BP)"
                      } else {
                        Copy-Item staticwebapp.config.json out/staticwebapp.config.json -Force
                      }
                    }
# Every hook declares BOTH a posix: and a windows: variant. A hook with only
# `shell: sh` cannot run on Windows: azd resolves `sh` from PATH, and a default
# Git for Windows install puts only `Git\cmd` there (git.exe), while sh.exe
# lives in `Git\usr\bin`. So `azd up` from PowerShell found no shell at all and
# every hook failed. Keep both branches in sync when changing either.
#
# NOTE: when windows: and posix: are both present, azd forbids `run`, `shell`,
# `kind`, `dir`, `interactive`, `continueOnError`, `secrets` and `config` at the
# parent level — they belong inside each branch.
hooks:
    postdeploy:
      posix:
        shell: sh
        run: |
            # Grant the Foundry hosted-agent instance identity its least-privilege
            # data-plane roles. This identity is created by `azd ai agent deploy`
            # after provisioning, so Bicep cannot assign its roles — this hook does.
            # Best-effort: never block the rest of postdeploy on it.
            ./hooks/assign-agent-roles.sh || echo "⚠️  Agent role assignment had issues (see above); continuing."
            # --from-deploy forbids the script from prompting. Which skills to
            # upload was already asked at preprovision, before azd started
            # painting its progress table over hook output.
            ./hooks/postdeploy.sh --from-deploy
        # Deliberately NOT interactive: nothing here may stop and wait for the
        # user at the end of a deploy. Belt and braces with --from-deploy above.
      windows:
        shell: pwsh
        # Neither script may fail the deploy. assign-agent-roles.ps1 exits 1 on a
        # real failure (as the .sh does), so its exit code is reported and
        # swallowed here — the same effect the sh branch gets with `|| echo`.
        run: |
            ./hooks/assign-agent-roles.ps1
            if ($LASTEXITCODE -ne 0) { Write-Host "⚠️  Agent role assignment had issues (see above); continuing." }
            ./hooks/postdeploy.ps1 -FromDeploy
        # Same rule as posix: never interactive at the end of a deploy.
    postprovision:
      posix:
        shell: sh
        run: |
            # The azure.ai.agents extension requires AZURE_TENANT_ID in the azd
            # environment to deploy the hosted agent and auto-assign Foundry User
            # to its identity. azd does not populate this automatically, so set it
            # from the current Azure CLI session if it isn't already present.
            if [ -z "${AZURE_TENANT_ID:-}" ]; then
                TID="$(az account show --query tenantId -o tsv 2>/dev/null || true)"
                if [ -n "$TID" ]; then
                    azd env set AZURE_TENANT_ID "$TID"
                    echo "Set AZURE_TENANT_ID=$TID"
                fi
            fi
            echo "Post-provisioning: configuring services..."
            # Tenant-wide admin consent for the OBO server app's Graph User.Read.
            # Lives here rather than in Bicep because it needs an Entra directory
            # role that most deployers do not have, and Bicep cannot continue past
            # a forbidden resource. Best-effort: never blocks the deploy.
            ./hooks/grant-obo-consent.sh || echo "⚠️  OBO admin consent step had issues (see above); continuing."
            echo "Deployment complete."
      windows:
        shell: pwsh
        run: |
            if (-not $env:AZURE_TENANT_ID) {
                $Tid = (az account show --query tenantId -o tsv 2>$null)
                if ($Tid) {
                    azd env set AZURE_TENANT_ID "$Tid"
                    Write-Host "Set AZURE_TENANT_ID=$Tid"
                }
            }
            Write-Host "Post-provisioning: configuring services..."
            ./hooks/grant-obo-consent.ps1
            Write-Host "Deployment complete."
    predeploy:
      posix:
        shell: sh
        run: |
            BUILD_TS="$(date +%s)"
            azd env set KRATOS_BUILD_TS "$BUILD_TS"
            echo "KRATOS_BUILD_TS=$BUILD_TS (forces new hosted-agent version)"
      windows:
        shell: pwsh
        run: |
            $BuildTs = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            azd env set KRATOS_BUILD_TS "$BuildTs"
            Write-Host "KRATOS_BUILD_TS=$BuildTs (forces new hosted-agent version)"
    preprovision:
      posix:
        # check-azure-prereqs.sh runs first and exits non-zero if the
        # subscription is missing the Container Apps VNet feature. Failing here
        # costs seconds and provisions nothing; failing without it costs ~15
        # minutes and leaves a half-created Container Apps environment that has
        # to be deleted by hand.
        #
        # Then: ask which skills to upload, at the very start rather than at
        # upload time. azd repaints its progress table over anything a hook
        # prints once the run is under way, which was swallowing the menu and
        # the prompt. hooks/postdeploy.sh reads the answer and uploads without
        # prompting.
        shell: sh
        run: |
            ./hooks/check-azure-prereqs.sh || exit 1
            ./hooks/select-use-cases.sh
        interactive: true
      windows:
        # No menu on Windows: the posix script drives it through /dev/tty, which
        # Windows has not got, and a hook blocking on stdin while azd owns the
        # console hangs the deploy. The .ps1 records "none" and prints how to
        # force the upload with KRATOS_UPLOAD_USE_CASES. Not interactive, so azd
        # hands it no terminal to block on.
        shell: pwsh
        run: |
            ./hooks/check-azure-prereqs.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./hooks/select-use-cases.ps1
        interactive: false
