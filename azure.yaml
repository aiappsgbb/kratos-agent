# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    # Native Python hooks remove the Bash/WSL/Git Bash ambiguity on Windows.
    # azd checks this before running any hook and prints an upgrade link when
    # the installed CLI is too old.
    azd: '>=1.33.0'
    extensions:
        azure.ai.agents: '>=0.1.25-preview'
name: kratos-agent
metadata:
    template: kratos-agent@0.1.0
services:
    agent-service:
        project: ./src/backend
        host: containerapp
        language: python
        docker:
            path: ./Dockerfile
            context: ../..
            # Build in ACR rather than locally. The image installs Python
            # packages, so a local build needs files.pythonhosted.org — which
            # is blocked on some corporate networks. Building remotely also
            # avoids needing a working Docker daemon to deploy.
            remoteBuild: true
    kratos-agent:
        project: ./src/hosted-agent
        host: azure.ai.agent
        language: docker
        docker:
            path: ./Dockerfile
            context: ../..
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: "1"
                    memory: 2Gi
            env:
                APM_USE_CASES_ROOT: /app/use-cases
                BLOB_SKILLS_CONTAINER: skills
                BLOB_STORAGE_ENDPOINT: ${AZURE_BLOB_STORAGE_ENDPOINT}
                COSMOS_DB_DATABASE: kratos-agent
                COSMOS_DB_ENDPOINT: ${AZURE_COSMOS_DB_ENDPOINT}
                KEY_VAULT_URI: ${AZURE_KEY_VAULT_URI}
                MODEL_DEPLOYMENT_NAME: ${FOUNDRY_MODEL_DEPLOYMENT}
                OBO_MCP_SERVER_MCP_URL: ${OBO_MCP_SERVER_MCP_URL}
                OBO_MCP_SERVER_NAME: graph-obo
    obo-mcp-server:
        project: ./src/obo-mcp-server
        host: containerapp
        language: python
        # infra/main.bicep only creates this container app when deployObo is
        # true, and main.parameters.json feeds that from the same DEPLOY_OBO
        # value with the same default. Without this condition azd tries to
        # deploy a service that was deliberately never provisioned, so
        # `azd up` always failed on environments with OBO turned off.
        condition: ${DEPLOY_OBO=true}
        docker:
            path: ./Dockerfile
            remoteBuild: true
    web:
        project: ./src/frontend
        host: staticwebapp
        language: js
        dist: out
        hooks:
            predeploy:
                name: predeploy
                kind: python
                run: ./scripts/prepare_deploy.py
                dir: .
hooks:
    postdeploy:
        name: postdeploy
        kind: python
        run: ./hooks/postdeploy.py
        dir: .
        # Nothing here may stop and wait for user input at the end of a deploy.
        interactive: false
    postprovision:
        name: postprovision
        kind: python
        run: ./hooks/postprovision.py
        dir: .
    predeploy:
        name: predeploy
        kind: python
        run: ./hooks/predeploy.py
        dir: .
    preprovision:
        name: preprovision
        kind: python
        run: ./hooks/preprovision.py
        dir: .
        interactive: true
